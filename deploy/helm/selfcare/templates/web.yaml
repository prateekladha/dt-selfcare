apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    {{- include "selfcare.labels" . | nindent 4 }}
spec:
  # replicas owned by the HPA (setting it here fights the autoscaler on every upgrade)
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 1, maxSurge: 0 } }   # min 2 pods: in place, one at a time (PDB keeps one serving)
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # image user "node" is non-numeric; runAsNonRoot needs a UID
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets: [{ name: ocir-pull }]
      containers:
        - name: web
          image: {{ include "selfcare.image" (dict "root" . "name" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: CORE_API_URL, value: "http://core-api:8080" }
            - { name: PAYMENTS_URL, value: "http://payments-service:8080" }
            - { name: ASSISTANT_URL, value: "http://assistant-service:8080" }
            - name: SESSION_SECRET   # its own cookie-signing secret: the web pod holds no token-signing key
              valueFrom: { secretKeyRef: { name: selfcare-secrets, key: session-secret } }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          {{- include "selfcare.containerSecurity" . | nindent 10 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: web }
spec:
  selector: { app: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: web }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: {{ .Values.web.hpa.min }}
  maxReplicas: {{ .Values.web.hpa.max }}
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.web.hpa.cpu }} } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: web }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: web } }
