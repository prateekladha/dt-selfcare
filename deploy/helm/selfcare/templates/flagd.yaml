apiVersion: v1
kind: ConfigMap
metadata:
  name: flagd-flags
  labels:
    {{- include "selfcare.labels" . | nindent 4 }}
data:
  flags.json: |
    {{- dict "flags" .Values.flags | toPrettyJson | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata: { name: flagd }
spec:
  selector: { app: flagd }
  ports: [{ name: grpc, port: 8013, targetPort: 8013 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
  labels:
    {{- include "selfcare.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app: flagd } }
  template:
    metadata:
      labels: { app: flagd }
      annotations: { checksum/flags: {{ toJson .Values.flags | sha256sum }} }
    spec:
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: flagd
          image: ghcr.io/open-feature/flagd:v0.12.9
          args: ["start", "--uri", "file:/etc/flagd/flags.json"]
          ports: [{ containerPort: 8013 }]
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
          readinessProbe: { httpGet: { path: /readyz, port: 8014 }, periodSeconds: 10 }
          volumeMounts: [{ name: flags, mountPath: /etc/flagd }]
          {{- include "selfcare.containerSecurity" . | nindent 10 }}
      volumes: [{ name: flags, configMap: { name: flagd-flags } }]
