{{- /* LLM gateway (LiteLLM, OpenAI-compatible). The ONLY component holding provider keys.
       Services call model aliases; the gateway does routing, fallback (DeepSeek -> Mistral EU), retries,
       cooldown of failing deployments, per-deployment rate limits, and ships traces to Langfuse. */}}
{{- if .Values.llmGateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  labels:
    {{- include "selfcare.labels" . | nindent 4 }}
data:
  config.yaml: |
    model_list:
      - model_name: billing-llm                 # primary
        litellm_params:
          model: deepseek/deepseek-chat
          api_key: os.environ/DEEPSEEK_API_KEY
          # a stalled stream (no token for 12 s; first token is normally 1-2 s) fails fast to a retry/fallback;
          # with the 30 s router timeout one stuck upstream call made an assistant answer take 60 s
          stream_timeout: 12
          timeout: 20
          rpm: {{ .Values.llmGateway.primaryRpm }}
          tpm: {{ .Values.llmGateway.primaryTpm }}
      - model_name: billing-llm-fallback        # EU-hosted fallback
        litellm_params:
          model: mistral/mistral-small-latest
          api_key: os.environ/MISTRAL_API_KEY
          stream_timeout: 12
          timeout: 20
          rpm: {{ .Values.llmGateway.fallbackRpm }}
      - model_name: title-llm                   # nano model: chat titles
        litellm_params:
          model: mistral/ministral-3b-latest
          api_key: os.environ/MISTRAL_API_KEY
          rpm: 300
      - model_name: title-llm-fallback
        litellm_params:
          model: deepseek/deepseek-chat
          api_key: os.environ/DEEPSEEK_API_KEY
    router_settings:
      num_retries: 1            # one quick retry, then the fallback model (not two more 30 s waits)
      retry_after: 1
      timeout: 20
      allowed_fails: 3          # failures before a deployment is cooled down
      cooldown_time: 30
      fallbacks: [{"billing-llm": ["billing-llm-fallback"]}, {"title-llm": ["title-llm-fallback"]}]
    litellm_settings:
      drop_params: true
      {{- if .Values.llmGateway.langfuse }}
      success_callback: ["langfuse"]
      failure_callback: ["langfuse"]
      {{- end }}
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
---
apiVersion: v1
kind: Service
metadata: { name: llm-gateway }
spec:
  selector: { app: llm-gateway }
  ports: [{ name: http, port: 4000, targetPort: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels:
    app: llm-gateway
    {{- include "selfcare.labels" . | nindent 4 }}
spec:
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 1, maxSurge: 0 } }   # min 2 pods: in place (PDB keeps one serving)
  selector: { matchLabels: { app: llm-gateway } }
  template:
    metadata:
      labels: { app: llm-gateway }
      # config/rev: bump when the model_list/router config above changes (the values checksum doesn't see it)
      annotations: { checksum/config: {{ toJson .Values.llmGateway | sha256sum }}, config/rev: "2" }
    spec:
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      imagePullSecrets: [{ name: ocir-pull }]
      containers:
        - name: litellm
          image: {{ include "selfcare.image" (dict "root" . "name" "llm-gateway") }}   # slim self-built (deploy/docker/gateway.Dockerfile)
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]   # single process; scale with pods (HPA). --num_workers never binds the port in this image
          ports: [{ containerPort: 4000 }]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: selfcare-secrets, key: llm-gateway-key } }
            - name: DEEPSEEK_API_KEY
              valueFrom: { secretKeyRef: { name: selfcare-deepseek-api-key, key: value, optional: true } }
            - name: MISTRAL_API_KEY
              valueFrom: { secretKeyRef: { name: selfcare-mistral-api-key, key: value, optional: true } }
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: selfcare-langfuse-public-key, key: value, optional: true } }
            - name: LANGFUSE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: selfcare-langfuse-secret-key, key: value, optional: true } }
            - { name: LANGFUSE_HOST, value: {{ .Values.llmGateway.langfuseHost | quote }} }
          readinessProbe: { httpGet: { path: /health/readiness, port: 4000 }, periodSeconds: 10, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/liveliness, port: 4000 }, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 5 }
          startupProbe: { httpGet: { path: /health/liveliness, port: 4000 }, periodSeconds: 3, failureThreshold: 40 }
          resources: { requests: { cpu: 75m, memory: 512Mi }, limits: { memory: 1536Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: config, mountPath: /etc/litellm }]
      volumes: [{ name: config, configMap: { name: llm-gateway-config } }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: llm-gateway }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: llm-gateway }
  minReplicas: 2   # every AI feature depends on it: no single point of failure
  maxReplicas: 4
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: llm-gateway }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: llm-gateway } }
{{- end }}
