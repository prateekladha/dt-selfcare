{{- /* Temporal (durable workflows for write actions). Single-node server with its SQLite store on a block
       volume: workflows survive pod/worker restarts. Production: Temporal Cloud or an HA cluster on
       Postgres/Cassandra - the workers and code are unchanged. */}}
{{- if .Values.temporal.enabled }}
apiVersion: v1
kind: Service
metadata: { name: temporal }
spec:
  selector: { app: temporal }
  ports:
    - { name: grpc, port: 7233, targetPort: 7233 }
    - { name: ui, port: 8233, targetPort: 8233 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal
  labels:
    app: temporal
    {{- include "selfcare.labels" . | nindent 4 }}
spec:
  serviceName: temporal
  replicas: 1
  selector: { matchLabels: { app: temporal } }
  template:
    metadata: { labels: { app: temporal } }
    spec:
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: temporal
          image: {{ .Values.temporal.image }}
          args: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0", "--db-filename", "/data/temporal.db",
                 "--namespace", "default", "--log-level", "warn"]
          ports: [{ containerPort: 7233 }, { containerPort: 8233 }]
          readinessProbe: { tcpSocket: { port: 7233 }, periodSeconds: 10 }
          resources: { requests: { cpu: 25m, memory: 192Mi }, limits: { memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.valkey.storageClass }}
        resources: { requests: { storage: 50Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-worker
  labels:
    app: workflow-worker
    {{- include "selfcare.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 1, maxSurge: 0 } }   # background worker: tasks wait in their queue
  selector: { matchLabels: { app: workflow-worker } }
  template:
    metadata: { labels: { app: workflow-worker } }
    spec:
      {{- include "selfcare.podSecurity" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "selfcare.image" (dict "root" . "name" "core-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["workflow-worker"]
          env:
            {{- include "selfcare.env" . | nindent 12 }}
          resources: { requests: { cpu: 25m, memory: 192Mi }, limits: { memory: 512Mi } }
          {{- include "selfcare.containerSecurity" . | nindent 10 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
{{- end }}
