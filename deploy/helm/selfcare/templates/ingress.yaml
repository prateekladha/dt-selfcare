{{- /* Only the web app and the payment webhook are public. The collector, Valkey, flagd and
       core-api's other routes are cluster-internal. */}}
{{- if .Values.domain }}
{{- if .Values.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: { name: letsencrypt }
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    {{- with .Values.tls.email }}
    email: {{ . }}
    {{- end }}
    privateKeySecretRef: { name: letsencrypt-account }
    solvers: [{ http01: { ingress: { ingressClassName: traefik } } }]
---
{{- end }}
# Edge rate limit per client IP (Traefik = API gateway). Requires the real client IP: the Traefik
# Service runs with externalTrafficPolicy: Local (cluster-addons.sh), so the LB does not SNAT.
{{- if .Values.edge.rateLimit.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: ratelimit }
spec:
  rateLimit:
    average: {{ .Values.edge.rateLimit.average }}
    burst: {{ .Values.edge.rateLimit.burst }}
    period: 1s
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: selfcare
  annotations:
    {{- if .Values.tls.enabled }}
    cert-manager.io/issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- end }}
    {{- if .Values.edge.rateLimit.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-ratelimit@kubernetescrd
    {{- end }}
spec:
  ingressClassName: traefik
  {{- if .Values.tls.enabled }}
  tls: [{ hosts: [{{ .Values.domain | quote }}], secretName: selfcare-tls }]
  {{- end }}
  rules:
    - host: {{ .Values.domain | quote }}
      http:
        paths:
          - { path: /v1/webhooks/razorpay, pathType: Exact, backend: { service: { name: payments-service, port: { number: 8080 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
{{- end }}
