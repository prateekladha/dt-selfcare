{{- /* Secrets live in OCI Vault; External Secrets Operator syncs them using the node's instance
       principal (no static cloud credentials in the cluster). Hooks so they exist before db-init. */}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: oci-vault
  annotations: { "helm.sh/hook": pre-install,pre-upgrade, "helm.sh/hook-weight": "-20", "helm.sh/hook-delete-policy": before-hook-creation }
  labels: {{- include "selfcare.labels" . | nindent 4 }}
spec:
  provider:
    oracle:
      vault: {{ required "oci.vaultId is required" .Values.oci.vaultId | quote }}
      region: {{ .Values.oci.region | quote }}
      principalType: InstancePrincipal
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: selfcare-secrets
  annotations: { "helm.sh/hook": pre-install,pre-upgrade, "helm.sh/hook-weight": "-10", "helm.sh/hook-delete-policy": before-hook-creation }
spec:
  refreshInterval: 5m
  secretStoreRef: { name: oci-vault, kind: SecretStore }
  target: { name: selfcare-secrets, deletionPolicy: Retain }
  data:
  {{- range list "db-admin-password" "db-app-password" "db-dsn" "stream-username" "stream-password" "jwt-secret" "demo-password" "collector-source-tokens" "source-token" "llm-gateway-key" }}
    - secretKey: {{ . }}
      remoteRef: { key: {{ printf "%s%s" $.Values.secretPrefix . }} }
  {{- end }}
---
{{- range .Values.thirdPartySecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: selfcare-{{ . }}   # optional third-party keys: regular resources (nothing needs them pre-install)
spec:
  refreshInterval: 1m
  secretStoreRef: { name: oci-vault, kind: SecretStore }
  target: { name: selfcare-{{ . }}, deletionPolicy: Retain }
  data:
    - secretKey: value
      remoteRef: { key: {{ printf "%s%s" $.Values.secretPrefix . }} }
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ocir-pull
  annotations: { "helm.sh/hook": pre-install,pre-upgrade, "helm.sh/hook-weight": "-10", "helm.sh/hook-delete-policy": before-hook-creation }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: oci-vault, kind: SecretStore }
  target:
    name: ocir-pull
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ printf `{"auths":{"%s.ocir.io":{"username":"%s/dt-selfcare-svc","password":"{{ .pw }}","auth":"{{ printf "%%s:%%s" "%s/dt-selfcare-svc" .pw | b64enc }}"}}}` .Values.oci.region .Values.oci.namespace .Values.oci.namespace | squote }}
  data:
    - secretKey: pw
      remoteRef: { key: {{ printf "%sstream-password" .Values.secretPrefix }} }
