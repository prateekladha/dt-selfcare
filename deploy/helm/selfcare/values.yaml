image:
  registry: ap-mumbai-1.ocir.io/NAMESPACE/dt-selfcare
  tag: latest
  pullPolicy: IfNotPresent

domain: ""            # e.g. 1.2.3.4.sslip.io - set by deploy script from the LB IP
tls:
  enabled: true
  email: ""           # Let's Encrypt account email (optional)

oci:
  region: ap-mumbai-1
  vaultId: ""
  namespace: ""
  rawBucket: dt-selfcare-usage-raw

stream:
  bootstrap: cell-1.streaming.ap-mumbai-1.oci.oraclecloud.com:9092
  usageTopic: usage-events
  alertsTopic: usage-alerts
  partitions: 4

secretPrefix: dt-selfcare-

# Optional third-party keys synced from Vault (list only what this environment has provisioned;
# an ExternalSecret for a missing key is NotReady and would block `helm --wait`).
thirdPartySecrets: [razorpay-key-id, razorpay-key-secret, razorpay-webhook-secret, deepseek-api-key, mistral-api-key, langfuse-public-key, langfuse-secret-key]

valkey:
  storage: 50Gi       # OCI block volume minimum
  storageClass: oci-bv
  maxmemory: 1gb

demo:
  seed: true
  backfillMonths: 12
  live: true

workloads:
  usage-collector:
    image: usage-collector
    command: ["python", "-c", "from usage_collector.app import run; run()"]
    port: 8080
    replicas: 1
    hpa: { min: 1, max: 6, cpu: 70 }
    resources: { requests: { cpu: 25m, memory: 192Mi }, limits: { memory: 512Mi } }
  usage-aggregator:
    image: usage-aggregator
    command: ["usage-aggregator"]
    replicas: 2       # <= stream partitions; each pod owns a subset
    resources: { requests: { cpu: 25m, memory: 192Mi }, limits: { memory: 512Mi } }
  raw-archiver:
    image: usage-aggregator
    command: ["archiver"]
    replicas: 1
    resources: { requests: { cpu: 25m, memory: 128Mi }, limits: { memory: 512Mi } }
  alert-relay:
    image: usage-aggregator
    command: ["alert-relay"]
    replicas: 1
    resources: { requests: { cpu: 25m, memory: 128Mi }, limits: { memory: 256Mi } }
  core-api:
    image: core-api
    command: ["core-api"]
    port: 8080
    replicas: 2
    hpa: { min: 2, max: 8, cpu: 70 }
    # request = measured per-pod CPU at normal load: with 25m the HPA saw "70% busy" at idle and sat at max
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
  payments-service:   # checkout, confirmation, webhook, reconciler; owns `payments`
    image: core-api
    command: ["payments-service"]
    port: 8080
    replicas: 2
    hpa: { min: 2, max: 6, cpu: 70 }
    resources: { requests: { cpu: 25m, memory: 192Mi }, limits: { memory: 512Mi } }
  assistant-service:  # tool-calling agent + SSE streams; owns `context_docs`, `agent_traces`
    image: core-api
    command: ["assistant-service"]
    port: 8080
    replicas: 1
    hpa: { min: 1, max: 6, cpu: 65 }
    resources: { requests: { cpu: 75m, memory: 384Mi }, limits: { memory: 1Gi } }
  order-adapter:   # TMF622 ProductOrder API in front of the legacy order systems (country adapters, per-country rate limit)
    image: core-api
    command: ["order-adapter"]
    port: 8080
    replicas: 1
    hpa: { min: 1, max: 4, cpu: 70 }
    resources: { requests: { cpu: 25m, memory: 192Mi }, limits: { memory: 512Mi } }
  notifier:   # alerts, outbox relay (payment-events, order-events), billing + order-projection consumers, context spine
    image: core-api
    command: ["notifier"]
    replicas: 1
    resources: { requests: { cpu: 25m, memory: 320Mi }, limits: { memory: 768Mi } }

web:
  replicas: 2
  hpa: { min: 2, max: 6, cpu: 70 }
  # realistic request: with 25m the HPA saw "busy" at idle and ran 6 pods
  resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 384Mi } }

temporal:
  enabled: true
  image: docker.io/temporalio/temporal:1.10.0

llmGateway:
  enabled: true
  primaryRpm: 300
  primaryTpm: 600000
  fallbackRpm: 120
  langfuse: true           # traces every LLM call to Langfuse (keys in Vault)
  langfuseHost: https://cloud.langfuse.com

flags:
  ai-explanations:
    state: ENABLED
    variants: { "on": true, "off": false }
    defaultVariant: "on"
  # Provider-agnostic AI layer. Demo: DeepSeek API. EU production: "mistral" (EU-hosted) or
  # "selfhosted" (open weights on vLLM in an EU region) - customer data never leaves the EU.
  demo-accounts-panel:   # public per-demo-line summary on the login page (never enable in production)
    state: ENABLED
    variants: { "on": true, "off": false }
    defaultVariant: "on"
  ai-provider:
    state: ENABLED
    variants: { deepseek: deepseek, mistral: mistral, selfhosted: selfhosted, template: template }
    defaultVariant: deepseek
  payments-enabled:
    state: ENABLED
    variants: { "on": true, "off": false }
    defaultVariant: "on"
  payment-gateway:
    state: ENABLED
    variants: { razorpay: razorpay, cashfree: cashfree }
    defaultVariant: razorpay
  # Gateway charge currency. Demo: "inr" - Razorpay test mode cannot enable international payments,
  # and any non-INR order (EUR/PLN) counts as international, so the gateway is charged the INR
  # equivalent at a recorded rate while the bill and ledger stay EUR/PLN. EU production: "native"
  # on an EU gateway (Adyen/Stripe). FX would come from a rate feed, not a constant.
  payment-settlement:
    state: ENABLED
    variants:
      native: { currency: native }
      inr: { currency: INR, fx: { EUR: 90.0, PLN: 21.0 } }
    defaultVariant: inr
  usage-alert-thresholds:
    state: ENABLED
    variants: { standard: { levels: [50, 80, 100] }, strict: { levels: [50, 75, 90, 100] } }
    defaultVariant: standard
  throttle-at-100:
    state: ENABLED
    variants: { "on": true, "off": false }
    defaultVariant: "on"

# API gateway (Traefik) edge protection
edge:
  rateLimit: { enabled: true, average: 40, burst: 120 }   # enable after granting CI the traefik.io Role (deploy/k8s-ci-traefik-role.yaml)   # requests/s per client IP (a page = ~3-6 requests)

billDay:
  explainRps: "2"   # LLM explanations/s generated right after the bill run (gateway budget)
