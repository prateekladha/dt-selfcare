image:
  registry: ap-mumbai-1.ocir.io/NAMESPACE/dt-selfcare
  tag: latest
  pullPolicy: IfNotPresent

domain: ""            # e.g. 1.2.3.4.sslip.io - set by deploy script from the LB IP
tls:
  enabled: true
  email: ""           # Let's Encrypt account email (optional)

oci:
  region: ap-mumbai-1
  vaultId: ""
  namespace: ""
  rawBucket: dt-selfcare-usage-raw

stream:
  bootstrap: cell-1.streaming.ap-mumbai-1.oci.oraclecloud.com:9092
  usageTopic: usage-events
  alertsTopic: usage-alerts
  partitions: 4

secretPrefix: dt-selfcare-

# Optional third-party keys synced from Vault (list only what this environment has provisioned;
# an ExternalSecret for a missing key is NotReady and would block `helm --wait`).
thirdPartySecrets: [razorpay-key-id, razorpay-key-secret, razorpay-webhook-secret, deepseek-api-key]

valkey:
  storage: 50Gi       # OCI block volume minimum
  storageClass: oci-bv
  maxmemory: 1gb

demo:
  seed: true
  backfillMonths: 12
  live: true

workloads:
  usage-collector:
    image: usage-collector
    command: ["python", "-c", "from usage_collector.app import run; run()"]
    port: 8080
    replicas: 1
    hpa: { min: 1, max: 6, cpu: 70 }
    resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 512Mi } }
  usage-aggregator:
    image: usage-aggregator
    command: ["usage-aggregator"]
    replicas: 2       # <= stream partitions; each pod owns a subset
    resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 512Mi } }
  raw-archiver:
    image: usage-aggregator
    command: ["archiver"]
    replicas: 1
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
  alert-relay:
    image: usage-aggregator
    command: ["alert-relay"]
    replicas: 1
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
  core-api:
    image: core-api
    command: ["core-api"]
    port: 8080
    replicas: 2
    hpa: { min: 2, max: 8, cpu: 70 }
    resources: { requests: { cpu: 150m, memory: 256Mi }, limits: { memory: 768Mi } }
  notifier:
    image: core-api
    command: ["notifier"]
    replicas: 1
    resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { memory: 384Mi } }

web:
  replicas: 2
  hpa: { min: 2, max: 6, cpu: 70 }
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }

flags:
  ai-explanations:
    state: ENABLED
    variants: { "on": true, "off": false }
    defaultVariant: "on"
  # Provider-agnostic AI layer. Demo: DeepSeek API. EU production: "mistral" (EU-hosted) or
  # "selfhosted" (open weights on vLLM in an EU region) - customer data never leaves the EU.
  demo-accounts-panel:   # public per-demo-line summary on the login page (never enable in production)
    state: ENABLED
    variants: { "on": true, "off": false }
    defaultVariant: "on"
  ai-provider:
    state: ENABLED
    variants: { deepseek: deepseek, mistral: mistral, selfhosted: selfhosted, template: template }
    defaultVariant: deepseek
  payments-enabled:
    state: ENABLED
    variants: { "on": true, "off": false }
    defaultVariant: "on"
  payment-gateway:
    state: ENABLED
    variants: { razorpay: razorpay, cashfree: cashfree }
    defaultVariant: razorpay
  # Charge the bill's own currency (Razorpay accepts EUR/PLN orders on this account). The "inr"
  # variant exists for gateways/rails that can only settle INR (e.g. UPI); FX would come from a feed.
  payment-settlement:
    state: ENABLED
    variants:
      native: { currency: native }
      inr: { currency: INR, fx: { EUR: 90.0, PLN: 21.0 } }
    defaultVariant: native
  usage-alert-thresholds:
    state: ENABLED
    variants: { standard: { levels: [50, 80, 100] }, strict: { levels: [50, 75, 90, 100] } }
    defaultVariant: standard
  throttle-at-100:
    state: ENABLED
    variants: { "on": true, "off": false }
    defaultVariant: "on"
