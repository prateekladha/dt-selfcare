# Production delivery. Runs ONLY for main, i.e. after a pull request was validated (pr.yml) and merged
# (main is protected: no direct pushes). Builds + pushes images, helm upgrade, in-cluster smoke test,
# browser e2e on the live site.
name: deploy-prod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod   # shared with chaos.yml: a deploy and a chaos test never overlap
  cancel-in-progress: false

permissions:
  contents: read

env:
  OCI_REGION: ap-mumbai-1

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.13.9" }
      - run: uv sync --frozen
      - run: uv run ruff check libs services
      - run: uv run pytest -q
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run typecheck && npm run build
        working-directory: web
      - name: helm lint
        run: helm lint deploy/helm/selfcare -f deploy/helm/values-oci.yaml

  images:
    needs: test
    runs-on: ubuntu-24.04   # node pool is AMD E5 (A1 out of capacity); use ubuntu-24.04-arm + linux/arm64 for A1
    strategy:
      matrix:
        image: [core-api, usage-collector, usage-aggregator, network-emulator, web, llm-gateway]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.OCI_REGION }}.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image == 'web' && 'web' || '.' }}
          file: ${{ matrix.image == 'llm-gateway' && 'deploy/docker/gateway.Dockerfile' || (matrix.image == 'web' && 'web/Dockerfile' || 'Dockerfile') }}
          build-args: ${{ (matrix.image != 'web' && matrix.image != 'llm-gateway') && format('SERVICE={0}', matrix.image) || '' }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.OCIR_REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ vars.OCIR_REGISTRY }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    # prod only from main (manual dispatches included) and only while deploys are enabled
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: OCI credentials (CI user, deploy-only permissions)
        env:
          KEY: ${{ secrets.OCI_CI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci && printf '%s\n' "$KEY" > ~/.oci/key.pem && chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<CFG
          [DEFAULT]
          user=${{ secrets.OCI_CI_USER_OCID }}
          fingerprint=${{ secrets.OCI_CI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ env.OCI_REGION }}
          key_file=~/.oci/key.pem
          CFG
          chmod 600 ~/.oci/config
          pipx install oci-cli
      - name: kubeconfig
        env: { SUPPRESS_LABEL_WARNING: "True" }
        run: oci ce cluster create-kubeconfig --cluster-id "${{ vars.OCI_CLUSTER_ID }}" --file ~/.kube/config --token-version 2.0.0 --kube-endpoint PUBLIC_ENDPOINT
      - uses: azure/setup-helm@v4
      - name: helm upgrade
        env: { SUPPRESS_LABEL_WARNING: "True" }
        run: |
          helm upgrade --install selfcare deploy/helm/selfcare -n selfcare \
            -f deploy/helm/values-oci.yaml --set image.tag=${{ github.sha }} \
            --wait --timeout 20m --history-max 5 --force-conflicts
      - name: in-cluster smoke test (every case-study flow)
        run: helm test selfcare -n selfcare --logs --timeout 5m
      - name: public endpoint
        run: |
          DOMAIN=$(grep -E '^domain:' deploy/helm/values-oci.yaml | awk '{print $2}' | tr -d '"')
          for i in $(seq 1 30); do curl -fsS "https://$DOMAIN/healthz" && exit 0; sleep 10; done; exit 1
      # ---- Browser end-to-end on the LIVE site: a real customer journey, desktop + mobile ----
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: install e2e deps
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: e2e (Playwright, live)
        working-directory: web
        env: { SUPPRESS_LABEL_WARNING: "True" }
        run: |
          VAULT=$(grep -E '^  vaultId:' ../deploy/helm/values-oci.yaml | awk '{print $2}')
          DOMAIN=$(grep -E '^domain:' ../deploy/helm/values-oci.yaml | awk '{print $2}' | tr -d '"')
          PW=$(oci secrets secret-bundle get-secret-bundle-by-name --secret-name dt-selfcare-demo-password --vault-id "$VAULT" \
               --query 'data."secret-bundle-content".content' --raw-output | base64 -d)
          echo "::add-mask::$PW"
          E2E_PASSWORD="$PW" E2E_BASE_URL="https://$DOMAIN" npx playwright test --grep-invert "@payment|@outage"
          PW_B64=$(printf %s "$PW" | base64 -w0); echo "::add-mask::$PW_B64"   # masked in later steps' env dumps
          echo "PW_B64=$PW_B64" >> "$GITHUB_ENV"
      - name: e2e payment checkout (real Razorpay test gateway, up to the customer's card entry)
        working-directory: web
        run: |
          DOMAIN=$(grep -E '^domain:' ../deploy/helm/values-oci.yaml | awk '{print $2}' | tr -d '"')
          PW=$(printf %s "$PW_B64" | base64 -d); echo "::add-mask::$PW"
          E2E_PASSWORD="$PW" E2E_BASE_URL="https://$DOMAIN" npx playwright test --grep @payment --project desktop --retries 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens
          path: |
            web/e2e-screens
            web/e2e-results/**/test-failed-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens-and-report
          path: |
            web/e2e-screens
            web/e2e-results
            web/e2e-report
          retention-days: 14
      # ---- Assistant regression gate: golden questions on the live assistant, scored for grounding, required facts,
      #      tool use and (by a calibrated model-as-judge) policy correctness; the judge is re-measured against the
      #      human-labelled set first and only gates while it agrees with people (kappa >= 0.6). Results: System page.
      - name: assistant eval gate (golden set + calibrated policy judge)
        timeout-minutes: 10
        run: kubectl -n selfcare exec deploy/core-api -- run-evals --gate --calibrate
