[project]
name = "core-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "telco-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "oracledb>=2.5",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "reportlab>=4.2",
  "confluent-kafka>=2.6",
  "prometheus-client>=0.21",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.12",
  "oci>=2.130",
  "openfeature-provider-flagd>=0.1.5",
]

[tool.uv.sources]
telco-common = { workspace = true }

[project.scripts]
core-api = "core_api.main:run"
notifier = "core_api.notifier:main"
bill-run = "core_api.services.bills:cli"
db-init = "core_api.dbinit:main"
smoke-test = "core_api.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_api"]
