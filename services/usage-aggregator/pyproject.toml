[project]
name = "usage-aggregator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "telco-common",
  "valkey>=6.0",
  "confluent-kafka>=2.6",
  "oci>=2.130",
  "prometheus-client>=0.21",
  "openfeature-provider-flagd>=0.1.5",
]

[tool.uv.sources]
telco-common = { workspace = true }

[project.scripts]
usage-aggregator = "usage_aggregator.main:main"
archiver = "usage_aggregator.archiver:main"
alert-relay = "usage_aggregator.relay:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usage_aggregator"]
