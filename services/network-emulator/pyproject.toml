[project]
name = "network-emulator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["telco-common", "httpx>=0.27", "typer>=0.12"]

[tool.uv.sources]
telco-common = { workspace = true }

[project.scripts]
network-emulator = "network_emulator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_emulator"]
