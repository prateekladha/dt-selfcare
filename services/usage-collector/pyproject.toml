[project]
name = "usage-collector"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "telco-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "valkey>=6.0",
  "confluent-kafka>=2.6",
  "prometheus-client>=0.21",
  "openfeature-provider-flagd>=0.1.5",
]

[tool.uv.sources]
telco-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usage_collector"]
