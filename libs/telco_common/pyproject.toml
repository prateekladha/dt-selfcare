[project]
name = "telco-common"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.6", "openfeature-sdk>=0.7", "structlog>=24.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telco_common"]
